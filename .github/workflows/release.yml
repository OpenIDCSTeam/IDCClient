  #   needs: prepare
  #   runs-on: macos-latest
  #   strategy:
  #     fail-fast: false
  #     matrix:
  #       include:
  #         - arch: arm64
  #         - arch: amd64
  #   steps:
  #     - uses: actions/checkout@v4
  #
  #     - uses: actions/setup-go@v5
  #       with:
  #         go-version-file: go.mod
  #         cache: true
  #
  #     - name: Build
  #       env:
  #         CGO_ENABLED: '1'
  #         GOOS: darwin
  #         GOARCH: ${{ matrix.arch }}
  #       run: |
  #         mkdir -p dist
  #         go build -trimpath -ldflags "-s -w" -v -o "dist/hostagent-darwin-${{ matrix.arch }}" ./cmd/server
  #
  #     - name: Build pkg
  #       run: |
  #         chmod +x packaging/macos/build-pkg.sh
  #         ./packaging/macos/build-pkg.sh "${{ needs.prepare.outputs.version }}" "${{ matrix.arch }}"
  #
  #     - uses: actions/upload-artifact@v4
  #       with:
  #         name: hostagent-macos-${{ matrix.arch }}
  #         path: BuildCache/*.pkg
  #         if-no-files-found: error

  # ==========================================================================
  # 创建 Release
  # ==========================================================================
  release:
    needs: [prepare, build-linux, build-windows]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*-setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
