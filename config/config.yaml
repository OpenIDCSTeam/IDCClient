# OpenIDCS 客户端配置文件
server:
  host: "0.0.0.0"
  port: 1880
  mode: "debug"  # debug, release, test
  read_timeout: 30
  write_timeout: 30
  static_path: "./web/static"
  template_path: "./web/templates"

database:
  type: "sqlite"
  path: "./data/hostmanage.db"
  max_conn: 10
  idle_conn: 5

log:
  level: "info"  # debug, info, warn, error
  format: "json"  # json, text
  output: "./data/logs"
  max_size: 100    # MB
  max_age: 7       # days
  max_backups: 10
  compress: true

security:
  jwt_secret: "openidcs-secret-key-change-me"
  token_expire: 24  # hours
  cookie_secret: "openidcs-cookie-secret-change-me"
  enable_https: false
  cert_file: ""
  key_file: ""
  allow_origins: "*"
  allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
  allow_headers: "Origin,Content-Type,Authorization"

vnc:
  enable: true
  port_range: "5900-5999"
  max_sessions: 100
  session_timeout: 3600  # seconds
  encryption: true
  recording: false

network:
  enable_proxy: true
  proxy_port: 8080
  dns_servers:
    - "119.29.29.29"
    - "223.5.5.5"
  timeout: 30
  enable_ipv6: false