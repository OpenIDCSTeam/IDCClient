<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
    <style>
        @keyframes gentlePulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.85; }
        }
        .animate-pulse-slow { animation: gentlePulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        .card-hover {
            transition: all 0.25s ease;
        }
        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px -8px rgba(0, 0, 0, 0.1);
        }
        .smooth-transition {
            transition: all 0.25s ease;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <!-- 导航栏 -->
    <nav class="bg-white shadow-lg sticky top-0 z-50 flex-shrink-0">
        <div class="container mx-auto px-4">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center space-x-4">
                    <a href="/admin" class="flex items-center space-x-2 smooth-transition hover:scale-105">
                        <span class="iconify text-blue-600" data-icon="mdi:server-network" data-width="32" data-height="32"></span>
                        <h1 class="text-2xl font-bold text-blue-600">OpenIDCS</h1>
                    </a>
                    <div class="hidden md:flex space-x-1 ml-8">
                        <a href="/admin" class="text-gray-700 hover:text-blue-600 hover:bg-blue-50 px-4 py-2 rounded-lg text-sm font-medium smooth-transition">
                            <div class="flex items-center gap-2">
                                <span class="iconify" data-icon="mdi:view-dashboard" data-width="20"></span>
                                仪表盘
                            </div>
                        </a>
                        <a href="/hosts" class="text-gray-700 hover:text-blue-600 hover:bg-blue-50 px-4 py-2 rounded-lg text-sm font-medium smooth-transition">
                            <div class="flex items-center gap-2">
                                <span class="iconify" data-icon="mdi:server" data-width="20"></span>
                                主机管理
                            </div>
                        </a>
                        <a href="/debug" class="text-blue-600 bg-blue-50 px-4 py-2 rounded-lg text-sm font-medium smooth-transition">
                            <div class="flex items-center gap-2">
                                <span class="iconify" data-icon="mdi:file-document-multiple" data-width="20"></span>
                                日志管理
                            </div>
                        </a>
                        <a href="/settings" class="text-gray-700 hover:text-blue-600 hover:bg-blue-50 px-4 py-2 rounded-lg text-sm font-medium smooth-transition">
                            <div class="flex items-center gap-2">
                                <span class="iconify" data-icon="mdi:cog" data-width="20"></span>
                                系统设置
                            </div>
                        </a>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <div class="flex items-center space-x-2 text-gray-700 bg-gray-50 px-3 py-2 rounded-lg smooth-transition hover:bg-gray-100">
                        <span class="iconify text-gray-500" data-icon="mdi:account-circle" data-width="20"></span>
                        <span class="text-sm font-medium">{{.Username}}</span>
                    </div>
                    <a href="/logout" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-medium btn-hover shadow-sm flex items-center gap-2">
                        <span class="iconify" data-icon="mdi:logout" data-width="16"></span>
                        退出
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <main class="container mx-auto px-4 py-8 flex-grow">
        <!-- 页面标题 -->
        <div class="mb-6">
            <h1 class="text-3xl font-bold text-gray-800 flex items-center gap-3">
                <span class="iconify text-blue-600" data-icon="mdi:file-document-multiple" data-width="36"></span>
                日志管理
            </h1>
            <p class="text-gray-600 mt-1">查看系统运行日志和事件记录</p>
        </div>

        <!-- 过滤器 -->
        <div class="bg-white rounded-lg border border-gray-200 p-4 mb-6 card-hover">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">主机筛选</label>
                    <select id="hostFilter" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 smooth-transition text-sm">
                        <option value="">全部主机</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">日志级别</label>
                    <select id="levelFilter" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 smooth-transition text-sm">
                        <option value="">全部级别</option>
                        <option value="ERROR">错误</option>
                        <option value="WARNING">警告</option>
                        <option value="INFO">信息</option>
                        <option value="DEBUG">调试</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">显示条数</label>
                    <select id="limitFilter" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 smooth-transition text-sm">
                        <option value="50">50条</option>
                        <option value="100" selected>100条</option>
                        <option value="200">200条</option>
                        <option value="500">500条</option>
                    </select>
                </div>
                <div class="flex items-end">
                    <button onclick="loadLogs()" class="w-full bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium btn-hover shadow-sm flex items-center justify-center gap-2">
                        <span class="iconify" data-icon="mdi:refresh" data-width="18"></span>
                        刷新
                    </button>
                </div>
            </div>
        </div>

        <!-- 日志列表 -->
        <div class="bg-white rounded-lg border border-gray-200 card-hover">
            <div class="p-4 border-b border-gray-200 flex items-center justify-between">
                <h2 class="text-base font-semibold text-gray-800 flex items-center gap-2">
                    <span class="iconify text-blue-600" data-icon="mdi:format-list-bulleted" data-width="20"></span>
                    日志记录
                </h2>
            </div>
            <div id="logsContainer" class="max-h-96 overflow-y-auto">
                <div class="p-8 text-center text-gray-500 text-sm">
                    <span class="iconify animate-pulse-slow" data-icon="mdi:loading" data-width="20"></span>
                    <span class="ml-2">加载日志中...</span>
                </div>
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="bg-white border-t border-gray-200 flex-shrink-0">
        <div class="container mx-auto px-4 py-4">
            <div class="flex flex-col md:flex-row justify-between items-center text-sm text-gray-500">
                <div class="flex items-center gap-2 mb-2 md:mb-0">
                    <span class="iconify" data-icon="mdi:server-network" data-width="18"></span>
                    <span>OpenIDCS 虚拟化管理平台</span>
                </div>
                <div class="flex items-center gap-4">
                    <a href="https://github.com/OpenIDCSTeam" target="_blank" class="flex items-center gap-1 hover:text-blue-600 smooth-transition">
                        <span class="iconify" data-icon="mdi:github" data-width="16"></span>
                        OpenIDCS Team
                    </a>
                    <span>&copy; <span id="current-year"></span></span>
                </div>
            </div>
        </div>
    </footer>

    <script>
        document.getElementById('current-year').textContent = new Date().getFullYear();
        
        function showToast(message, type = 'info') {
            // 简化的toast提示
            console.log(`[${type.toUpperCase()}] ${message}`);
        }

        async function apiRequest(url, method = 'GET', data = null) {
            const options = {
                method,
                headers: {
                    'Content-Type': 'application/json'
                }
            };
            if (data) {
                options.body = JSON.stringify(data);
            }
            
            try {
                const response = await fetch(url, options);
                const result = await response.json();
                
                if (result.code === 401) {
                    window.location.href = '/login';
                    return null;
                }
                
                return result;
            } catch (error) {
                console.error('API请求失败:', error);
                showToast('请求失败，请重试', 'error');
                return null;
            }
        }

        // 加载主机列表
        async function loadHosts() {
            try {
            const result = await apiRequest('/api/server/detail');
                if (result && result.code === 200) {
                    const hostSelect = document.getElementById('hostFilter');
                    hostSelect.innerHTML = '<option value="">全部主机</option>';
                    
                    Object.keys(result.data).forEach(hostName => {
                        const option = document.createElement('option');
                        option.value = hostName;
                        option.textContent = hostName;
                        hostSelect.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('加载主机列表失败:', error);
            }
        }

        // 加载日志
        async function loadLogs() {
            try {
                const hsName = document.getElementById('hostFilter').value;
                const limit = document.getElementById('limitFilter').value;
                
            const result = await apiRequest(`/api/system/logger/detail?hs_name=${hsName}&limit=${limit}`);
                if (result && result.code === 200) {
                    renderLogs(result.data || []);
                }
            } catch (error) {
                console.error('加载日志失败:', error);
                document.getElementById('logsContainer').innerHTML = `
                    <div class="p-8 text-center text-red-500 text-sm">
                        <span class="iconify" data-icon="mdi:alert-circle" data-width="20"></span>
                        <span class="ml-2">加载日志失败</span>
                    </div>
                `;
            }
        }

        // 渲染日志
        function renderLogs(logs) {
            const container = document.getElementById('logsContainer');
            const levelFilter = document.getElementById('levelFilter').value;
            
            let filteredLogs = logs;
            if (levelFilter) {
                filteredLogs = logs.filter(log => log.level === levelFilter);
            }

            if (filteredLogs.length === 0) {
                container.innerHTML = `
                    <div class="p-8 text-center text-gray-500 text-sm">
                        <span class="iconify" data-icon="mdi:file-document-outline" data-width="20"></span>
                        <span class="ml-2">暂无日志记录</span>
                    </div>
                `;
                return;
            }

            let html = '<div class="divide-y divide-gray-200">';
            filteredLogs.forEach(log => {
                const level = log.level || 'INFO';
                const levelColor = getLevelColor(level);
                const timestamp = log.timestamp || new Date().toISOString();
                const time = new Date(timestamp).toLocaleString('zh-CN');
                const message = log.message || log.content || '无消息内容';
                const host = log.host || '系统';

                html += `
                    <div class="p-4 hover:bg-gray-50 smooth-transition">
                        <div class="flex items-start gap-3">
                            <div class="w-2 h-2 ${levelColor} rounded-full mt-2 flex-shrink-0"></div>
                            <div class="flex-1 min-w-0">
                                <div class="flex items-center justify-between mb-2">
                                    <div class="flex items-center gap-2 flex-wrap">
                                        <span class="text-xs font-semibold text-gray-600">${host}</span>
                                        <span class="text-xs ${levelColor} font-medium uppercase">${level}</span>
                                    </div>
                                    <span class="text-xs text-gray-500">${time}</span>
                                </div>
                                <p class="text-sm text-gray-800 break-words">${message}</p>
                            </div>
                        </div>
                    </div>
                `;
            });

            html += '</div>';
            container.innerHTML = html;
        }

        function getLevelColor(level) {
            switch (level.toUpperCase()) {
                case 'ERROR': return 'bg-red-500 text-red-600';
                case 'WARNING': return 'bg-yellow-500 text-yellow-600';
                case 'INFO': return 'bg-blue-500 text-blue-600';
                case 'DEBUG': return 'bg-gray-500 text-gray-600';
                default: return 'bg-gray-400 text-gray-600';
            }
        }

        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            loadHosts();
            loadLogs();
        });

        // 事件监听
        document.getElementById('hostFilter').addEventListener('change', loadLogs);
        document.getElementById('levelFilter').addEventListener('change', loadLogs);
        document.getElementById('limitFilter').addEventListener('change', loadLogs);
    </script>
</body>
</html>
