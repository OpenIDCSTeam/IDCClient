<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @keyframes gentlePulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.85; }
        }
        .animate-pulse-slow { animation: gentlePulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        .card-hover {
            transition: all 0.25s ease;
        }
        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px -8px rgba(0, 0, 0, 0.1);
        }
        .smooth-transition {
            transition: all 0.25s ease;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <!-- 导航栏 -->
    <nav class="bg-white shadow-lg sticky top-0 z-50 flex-shrink-0">
        <div class="container mx-auto px-4">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center space-x-4">
                    <a href="/admin" class="flex items-center space-x-2 smooth-transition hover:scale-105">
                        <span class="iconify text-blue-600" data-icon="mdi:server-network" data-width="32" data-height="32"></span>
                        <h1 class="text-2xl font-bold text-blue-600">OpenIDCS</h1>
                    </a>
                    <div class="hidden md:flex space-x-1 ml-8">
                        <a href="/admin" class="text-gray-700 hover:text-blue-600 hover:bg-blue-50 px-4 py-2 rounded-lg text-sm font-medium smooth-transition">
                            <div class="flex items-center gap-2">
                                <span class="iconify" data-icon="mdi:view-dashboard" data-width="20"></span>
                                仪表盘
                            </div>
                        </a>
                        <a href="/hosts" class="text-blue-600 bg-blue-50 px-4 py-2 rounded-lg text-sm font-medium smooth-transition">
                            <div class="flex items-center gap-2">
                                <span class="iconify" data-icon="mdi:server" data-width="20"></span>
                                主机管理
                            </div>
                        </a>
                        <a href="/debug" class="text-gray-700 hover:text-blue-600 hover:bg-blue-50 px-4 py-2 rounded-lg text-sm font-medium smooth-transition">
                            <div class="flex items-center gap-2">
                                <span class="iconify" data-icon="mdi:file-document-multiple" data-width="20"></span>
                                日志管理
                            </div>
                        </a>
                        <a href="/settings" class="text-gray-700 hover:text-blue-600 hover:bg-blue-50 px-4 py-2 rounded-lg text-sm font-medium smooth-transition">
                            <div class="flex items-center gap-2">
                                <span class="iconify" data-icon="mdi:cog" data-width="20"></span>
                                系统设置
                            </div>
                        </a>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <div class="flex items-center space-x-2 text-gray-700 bg-gray-50 px-3 py-2 rounded-lg smooth-transition hover:bg-gray-100">
                        <span class="iconify text-gray-500" data-icon="mdi:account-circle" data-width="20"></span>
                        <span class="text-sm font-medium">{{.Username}}</span>
                    </div>
                    <a href="/logout" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-medium btn-hover shadow-sm flex items-center gap-2">
                        <span class="iconify" data-icon="mdi:logout" data-width="16"></span>
                        退出
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <main class="container mx-auto px-4 py-8 flex-grow">
        <!-- 页面标题 -->
        <div class="mb-6">
            <h1 class="text-3xl font-bold text-gray-800 flex items-center gap-3">
                <span class="iconify text-blue-600" data-icon="mdi:server" data-width="36"></span>
                主机管理
            </h1>
            <p class="text-gray-600 mt-1">管理所有虚拟化主机</p>
        </div>

        <!-- 操作栏 -->
        <div class="bg-white rounded-lg border border-gray-200 p-4 mb-6 flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-4">
                <button onclick="loadHosts()"
                        class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm font-medium smooth-transition flex items-center gap-2">
                    <span class="iconify" data-icon="mdi:refresh" data-width="18"></span>
                    刷新
                </button>
            </div>
            <div class="text-sm text-gray-500 flex items-center gap-2">
                <span class="iconify" data-icon="mdi:information-outline" data-width="16"></span>
                共 <span id="hostCount" class="font-medium text-gray-700">0</span> 个主机
            </div>
        </div>

        <!-- 主机列表 -->
        <div id="hostsList" class="grid grid-cols-1 gap-4">
            <div class="col-span-full text-center py-16 text-gray-500">
                <span class="iconify animate-pulse-slow text-gray-400" data-icon="mdi:loading" data-width="48"></span>
                <p class="mt-4">加载中...</p>
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="bg-white border-t border-gray-200 flex-shrink-0">
        <div class="container mx-auto px-4 py-4">
            <div class="flex flex-col md:flex-row justify-between items-center text-sm text-gray-500">
                <div class="flex items-center gap-2 mb-2 md:mb-0">
                    <span class="iconify" data-icon="mdi:server-network" data-width="18"></span>
                    <span>OpenIDCS 虚拟化管理平台</span>
                </div>
                <div class="flex items-center gap-4">
                    <a href="https://github.com/OpenIDCSTeam" target="_blank" class="flex items-center gap-1 hover:text-blue-600 smooth-transition">
                        <span class="iconify" data-icon="mdi:github" data-width="16"></span>
                        OpenIDCS Team
                    </a>
                    <span>&copy; <span id="current-year"></span></span>
                </div>
            </div>
        </div>
    </footer>

    <!-- 全局消息提示 -->
    <div id="toast-container" class="fixed top-20 right-4 z-50 space-y-2"></div>

    <script>
        document.getElementById('current-year').textContent = new Date().getFullYear();
        
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const colors = {
                'success': 'bg-green-500',
                'error': 'bg-red-500',
                'warning': 'bg-yellow-500',
                'info': 'bg-blue-500'
            };
            const icons = {
                'success': 'mdi:check-circle',
                'error': 'mdi:alert-circle',
                'warning': 'mdi:alert',
                'info': 'mdi:information'
            };
            
            const toast = document.createElement('div');
            toast.className = `${colors[type]} text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-2 animate-fade-in`;
            toast.innerHTML = `
                <span class="iconify" data-icon="${icons[type]}" data-width="20"></span>
                <span>${message}</span>
            `;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.add('opacity-0', 'transition-opacity', 'duration-300');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        async function apiRequest(url, method = 'GET', data = null) {
            const options = {
                method,
                headers: {
                    'Content-Type': 'application/json'
                }
            };
            if (data) {
                options.body = JSON.stringify(data);
            }
            
            try {
                const response = await fetch(url, options);
                const result = await response.json();
                
                if (result.code === 401) {
                    window.location.href = '/login';
                    return null;
                }
                
                return result;
            } catch (error) {
                console.error('API请求失败:', error);
                showToast('请求失败，请重试', 'error');
                return null;
            }
        }

        // 加载主机列表
        async function loadHosts() {
            const container = document.getElementById('hostsList');
            container.innerHTML = `
                <div class="col-span-full text-center py-16 text-gray-500">
                    <span class="iconify animate-pulse-slow text-gray-400" data-icon="mdi:loading" data-width="48"></span>
                    <p class="mt-4">加载中...</p>
                </div>
            `;

            const result = await apiRequest('/api/server/detail');
            if (result && result.code === 200) {
                const hosts = result.data;
                const count = Object.keys(hosts).length;
                document.getElementById('hostCount').textContent = count;

                if (count === 0) {
                    container.innerHTML = `
                        <div class="col-span-full text-center py-16">
                            <span class="iconify text-gray-300" data-icon="mdi:server-off" data-width="64"></span>
                            <p class="mt-4 text-gray-500">暂无主机</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = '';
                for (const [name, host] of Object.entries(hosts)) {
                    container.innerHTML += renderHostCard(name, host);
                }
            } else {
                container.innerHTML = `
                    <div class="col-span-full text-center py-16">
                        <span class="iconify text-gray-300" data-icon="mdi:server-off" data-width="64"></span>
                        <p class="mt-4 text-gray-500">加载失败</p>
                    </div>
                `;
            }
        }

        // 渲染主机卡片
        function renderHostCard(name, host) {
            return `
                <div class="bg-white rounded-lg border border-gray-200 card-hover overflow-hidden">
                    <div class="p-4">
                        <div class="flex items-start justify-between mb-3">
                            <div class="flex items-center gap-3">
                                <div class="w-12 h-12 bg-gradient-to-br from-blue-500 to-blue-600 rounded-lg flex items-center justify-center shadow-md">
                                    <span class="iconify text-white" data-icon="mdi:server" data-width="28"></span>
                                </div>
                                <div>
                                    <h3 class="font-semibold text-gray-800">${name}</h3>
                                    <p class="text-sm text-gray-500">${host.type}</p>
                                </div>
                            </div>
                            <span class="px-2 py-1 text-xs font-medium ${host.status === 'active' ? 'text-green-700 bg-green-100' : 'text-gray-600 bg-gray-100'} rounded-full">
                                ${host.status === 'active' ? '运行中' : '已停止'}
                            </span>
                        </div>
                        
                        <div class="text-sm space-y-2">
                            <div class="flex items-center justify-between text-gray-600">
                                <span class="flex items-center gap-1">
                                    <span class="iconify" data-icon="mdi:ip-network" data-width="16"></span>
                                    地址
                                </span>
                                <span class="font-medium text-gray-800">${host.addr || '未配置'}</span>
                            </div>
                            <div class="flex items-center justify-between text-gray-600">
                                <span class="flex items-center gap-1">
                                    <span class="iconify" data-icon="mdi:cube-outline" data-width="16"></span>
                                    虚拟机
                                </span>
                                <span class="font-medium text-gray-800">${host.vm_count || 0} 台</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            loadHosts();
        });
    </script>
</body>
</html>
