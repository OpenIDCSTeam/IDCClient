version: '3.8'

services:
  openidcs-client:
    build:
      context: .
      dockerfile: Dockerfile
    image: openidcs-client:latest
    container_name: openidcs-client
    restart: unless-stopped
    ports:
      - "1880:1880"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./logs:/app/logs
    environment:
      - OPENIDCS_LOG_LEVEL=info
      - OPENIDCS_SERVER_MODE=release
    networks:
      - openidcs-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:1880/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 可选：添加数据库服务（如果使用MySQL或PostgreSQL）
